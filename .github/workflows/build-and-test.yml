name: Build and Test

on:
  push:
  workflow_dispatch:

env:

  SOLUTION_PATH: RaceDayApi.slnx

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore packages
        run: dotnet restore "${{ env.SOLUTION_PATH }}"

      - name: Build
        run: dotnet build "${{ env.SOLUTION_PATH }}" --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test "${{ env.SOLUTION_PATH }}" --configuration Release --no-build --logger "console;verbosity=detailed"